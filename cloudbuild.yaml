

steps:
  # 1. Build Frontend Docker Image
  - id: 'Build Frontend Image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/frontend:${_SHORT_SHA}' # Tag with short SHA for unique builds
      - '-t'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/frontend:latest' # Also tag with latest
      - './frontend' # Path to your frontend Dockerfile context (e.g., directory containing Dockerfile)

  # 2. Build Backend Docker Image
  - id: 'Build Backend Image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/backend:${_SHORT_SHA}' # Tag with short SHA
      - '-t'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/backend:latest1' # Also tag with latest
      - './backend' # Path to your backend Dockerfile context

  # 3. Push Frontend Docker Image to GCR
  - id: 'Push Frontend Image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/frontend:${_SHORT_SHA}'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/frontend:latest'

  # 4. Push Backend Docker Image to GCR
  - id: 'Push Backend Image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/backend:${_SHORT_SHA}'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/backend:latest1'

  # 5. Get GKE Credentials
  # This step configures kubectl to connect to your GKE cluster.
  - id: 'Get GKE Credentials'
    name: 'gcr.io/cloud-builders/gke-gcloud-auth-plugin' # Use this for newer gcloud versions
    args:
      - 'gcloud'
      - 'container'
      - 'clusters'
      - 'get-credentials'
      - '${_GKE_CLUSTER_NAME}'
      - '--zone=${_GKE_CLUSTER_LOCATION}' # Use --region if your cluster is regional
      - '--project=$PROJECT_ID'

  # ynamically updates the image tag in your frontend deployment file
  # to use the specific image built in this Cloud Build run.
  - id: 'Update Frontend Deployment Image'
    name: 'gcr.io/cloud-builders/gcloud' # Using gcloud builder as it has bash
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i "s|image: ${_GCR_HOSTNAME}/eighth-beacon-466412-f3/frontend:.*|image: ${_GCR_HOSTNAME}/eighth-beacon-466412-f3/frontend:${_SHORT_SHA}|" kubernetes/frontend-deployment.yaml

  # 7. Update Backend Image Tag in Deployment YAML
  # This step dynamically updates the image tag in your backend deployment file.
  - id: 'Update Backend Deployment Image'
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i "s|image: ${_GCR_HOSTNAME}/eighth-beacon-466412-f3/backend:.*|image: ${_GCR_HOSTNAME}/eighth-beacon-466412-f3/backend:${_SHORT_SHA}|" kubernetes/backend-deployment.yaml

  # 8. Deploy Frontend Deployment to GKE
  - id: 'Deploy Frontend Deployment'
    name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'apply'
      - '-f'
      - 'kubernetes/frontend-deployment.yaml' # Path to your frontend deployment file
      - '--namespace=${_GKE_NAMESPACE}'
    env:
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER_NAME}'
      - 'CLOUDSDK_COMPUTE_ZONE=${_GKE_CLUSTER_LOCATION}' # Or CLOUDSDK_COMPUTE_REGION

  # 9. Deploy Frontend Service to GKE
  - id: 'Deploy Frontend Service'
    name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'apply'
      - '-f'
      - 'kubernetes/frontend-service.yaml' # Path to your frontend service file
      - '--namespace=${_GKE_NAMESPACE}'
    env:
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER_NAME}'
      - 'CLOUDSDK_COMPUTE_ZONE=${_GKE_CLUSTER_LOCATION}' # Or CLOUDSDK_COMPUTE_REGION

  # 10. Deploy Backend Deployment to GKE
  - id: 'Deploy Backend Deployment'
    name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'apply'
      - '-f'
      - 'kubernetes/backend-deployment.yaml' # Path to your backend deployment file
      - '--namespace=${_GKE_NAMESPACE}'
    env:
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER_NAME}'
      - 'CLOUDSDK_COMPUTE_ZONE=${_GKE_CLUSTER_LOCATION}' # Or CLOUDSDK_COMPUTE_REGION

  # 11. Deploy Backend Service to GKE
  - id: 'Deploy Backend Service'
    name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'apply'
      - '-f'
      - 'kubernetes/backend-service.yaml' # Path to your backend service file
      - '--namespace=${_GKE_NAMESPACE}'
    env:
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER_NAME}'
      - 'CLOUDSDK_COMPUTE_ZONE=${_GKE_CLUSTER_LOCATION}' # Or CLOUDSDK_COMPUTE_REGION

# Optional: Specify images to be pushed to GCR/Artifact Registry
images:
  - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/frontend:${_SHORT_SHA}'
  - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/frontend:latest'
  - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/backend:${_SHORT_SHA}'
  - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/backend:latest1'
options:
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET # Add this line
serviceAccount: projects/eighth-beacon-466412-f3/serviceAccounts/trigger.481066924543-compute@developer.gserviceaccount.com

substitutions:
  _GCR_HOSTNAME: "gcr.io" # Or "us.gcr.io", "eu.gcr.io", etc.
  _GKE_CLUSTER_NAME: "hello-app-cluster" # REPLACE WITH YOUR GKE CLUSTER NAME
  _GKE_CLUSTER_LOCATION: "us-central1-c" # REPLACE WITH YOUR GKE CLUSTER REGION/ZONE (e.g., us-central1, us-central1-a)
  _GKE_NAMESPACE: "default" 
