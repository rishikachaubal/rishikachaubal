# cloudbuild.yaml

# This Cloud Build configuration builds Docker images, pushes them to GCR,
# and deploys them to a GKE cluster using direct kubectl commands.

# Define variables for easy modification
_GCR_HOSTNAME: "gcr.io" # Or "us.gcr.io", "eu.gcr.io", etc.
_GKE_CLUSTER_NAME: "hello-app-cluster" # REPLACE WITH YOUR GKE CLUSTER NAME
_GKE_CLUSTER_LOCATION: "us-central1-c" # REPLACE WITH YOUR GKE CLUSTER REGION/ZONE (e.g., us-central1, us-central1-a)
_GKE_NAMESPACE: "default" # The Kubernetes namespace to deploy to

steps:
  # 1. Build Frontend Docker Image
  - id: 'Build Frontend Image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/frontend:${_SHORT_SHA}' # Tag with short SHA for unique builds
      - '-t'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/frontend:latest' # Also tag with latest
      - './frontend' # Path to your frontend Dockerfile context (e.g., directory containing Dockerfile)

  # 2. Build Backend Docker Image
  - id: 'Build Backend Image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/backend:${_SHORT_SHA}' # Tag with short SHA
      - '-t'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/backend:latest1' # Also tag with latest
      - './backend' # Path to your backend Dockerfile context

  # 3. Push Frontend Docker Image to GCR
  - id: 'Push Frontend Image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/frontend:${_SHORT_SHA}'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/frontend:latest'

  # 4. Push Backend Docker Image to GCR
  - id: 'Push Backend Image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/backend:${_SHORT_SHA}'
      - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/backend:latest1'

  # 5. Get GKE Credentials
  # This step configures kubectl to connect to your GKE cluster.
  - id: 'Get GKE Credentials'
    name: 'gcr.io/cloud-builders/gke-gcloud-auth-plugin' # Use the new gke-gcloud-auth-plugin
    entrypoint: 'gcloud'
    args:
      - 'container'
      - 'clusters'
      - 'get-credentials'
      - '${_GKE_CLUSTER_NAME}'
      - '--region=${_GKE_CLUSTER_LOCATION}' # Use --region for regional clusters, --zone for zonal

  # 6. Deploy Frontend to GKE
  # This updates the image of the 'frontend' container within 'frontend-deployment'
  - id: 'Deploy Frontend to GKE'
    name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'set'
      - 'image'
      - 'deployment/frontend-deployment' # Your frontend Deployment name
      - 'frontend=${_GCR_HOSTNAME}/eighth-beacon-466412-f3/frontend:${_SHORT_SHA}' # container-name=image:tag
      - '--namespace=${_GKE_NAMESPACE}'
      # The --kubeconfig argument is often not strictly necessary when using the kubectl builder
      # as it's usually configured by the gcloud step, but it doesn't hurt to include it.
      # - '--kubeconfig'
      # - '/workspace/.kube/config'

  # 7. Deploy Backend to GKE
  # This updates the image of the 'backend' container within 'backend-deployment'
  - id: 'Deploy Backend to GKE'
    name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'set'
      - 'image'
      - 'deployment/backend-deployment' # Your backend Deployment name
      - 'backend=${_GCR_HOSTNAME}/eighth-beacon-466412-f3/backend:${_SHORT_SHA}' # container-name=image:tag
      - '--namespace=${_GKE_NAMESPACE}'
      # - '--kubeconfig'
      # - '/workspace/.kube/config'

# Images to be pushed to GCR (optional, but good practice for traceability)
images:
  - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/frontend:${_SHORT_SHA}'
  - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/frontend:latest'
  - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/backend:${_SHORT_SHA}'
  - '${_GCR_HOSTNAME}/eighth-beacon-466412-f3/backend:latest1'

# Optional: Timeout for the entire build
timeout: '10m'
