version: '3.3'

services:
  backend:
    build: ./backend
    container_name: backend_container
    ports:
      - "5000:5000" # Map host port 5000 to container port 5000
    environment:
        FLASK_RUN_HOST: 0.0.0.0
    restart: always 

  frontend:
    build: ./frontend
    container_name: frontend_container
    ports:
      - "8080:80" 
    depends_on:
      - backend 
    restart: always 
