# my-webapp-chart/templates/backend-deployment.yaml
{{- if .Values.backend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hello-chart.fullname" . }}-backend
  labels:
    {{- include "hello-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend # Helm-specific label
    app: hello-app # Your original label
    tier: backend # Your original label
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "hello-chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend # Helm-specific label
      app: hello-app # Your original label
      tier: backend # Your original label
  template:
    metadata:
      labels:
        {{- include "hello-chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend # Helm-specific label
        app: hello-app # Your original label
        tier: backend # Your original label
    spec:
      containers:
        - name: {{ .Values.backend.name }}
          image: "{{ .Values.backend.image.repository }}{{ if .Values.backend.image.tag }}:{{ .Values.backend.image.tag }}{{ else }}@{{ .Values.backend.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.targetPort }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- if .Values.backend.env }}
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
{{- end }}
