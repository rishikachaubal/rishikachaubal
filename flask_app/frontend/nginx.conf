server {
    listen 80;
    server_name localhost;

    # Serve static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy requests for /api/ to the backend service
    location /api/ {
        # IMPORTANT: 'backend' is the service name in docker-compose.yml
        # '5000' is the port the backend listens on internally
        proxy_pass https://flask-app-backend-1006906541746.us-central1.run.app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

